<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Lift Log</title>
<style>
:root{
  --bg:#0f1115;--surface:#181b22;--surface2:#222631;--line:#2c313d;
  --text:#e9ebef;--muted:#9aa1ad;
  --accent:#d4ff3a;--accent-ink:#141a00;--accent-text:#d4ff3a;
  --good:#4ade80;--warn:#fbbf24;--bad:#f87171;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f5f6f8;--surface:#ffffff;--surface2:#eef0f3;--line:#dde1e7;
    --text:#15181d;--muted:#5f6672;
    --accent:#c6f135;--accent-ink:#141a00;--accent-text:#4a6700;
    --good:#15803d;--warn:#b45309;--bad:#dc2626;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
.top h1{margin:0 auto;max-width:640px;font-size:22px;letter-spacing:-.01em}
main{max-width:640px;margin:0 auto;padding:12px 16px 24px}
h2{font-size:22px;margin:4px 0;letter-spacing:-.01em}
h3{font-size:17px;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h3{margin-bottom:10px}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.gap{gap:8px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.sm{font-size:14px}
.empty{color:var(--muted);text-align:center;padding:28px 8px}
.empty.sm{padding:12px 4px;font-size:14px}

.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;
  padding:10px 14px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;
  align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.small{min-height:34px;padding:6px 12px;font-size:14px}
.btn.block{display:flex;width:100%;margin:12px 0}
.icon-btn{border:0;background:var(--surface2);width:40px;height:40px;border-radius:10px;
  cursor:pointer;font-size:18px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn.subtle{background:transparent;color:var(--muted)}
.icon-btn.sm{width:32px;height:32px;font-size:14px}
.link{border:0;background:none;color:var(--accent-text);padding:6px 0;cursor:pointer;font-weight:600}

input,select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:16px;width:100%;min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-text);outline-offset:-1px}
.search{margin:4px 0 8px}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.main{color:var(--text);border:1px solid var(--line)}

/* log */
.datebar{display:flex;align-items:center;gap:8px}
.datepick{position:relative;flex:1;text-align:center;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;min-height:40px;display:flex;align-items:center;justify-content:center;font-weight:600}
.datepick input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0;padding:0}
.ex-name{border:0;background:none;padding:0;font-weight:700;font-size:17px;text-align:left;cursor:pointer}
.prev{font-size:13px;color:var(--muted);margin-top:6px}
.sets{list-style:none;margin:10px 0 0;padding:0}
.sets li{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.sets .n{width:20px;color:var(--muted);font-size:13px;text-align:right}
.sets .sv{flex:1;font-variant-numeric:tabular-nums;font-weight:600}
.badge{font-size:11px;font-weight:800;letter-spacing:.04em;background:var(--accent);color:var(--accent-ink);
  padding:2px 7px;border-radius:6px}
.addset{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px}
.addset label{position:relative;display:block}
.addset input{padding-right:44px;font-variant-numeric:tabular-nums}
.addset label span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}

/* lists */
.group-h{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 6px}
.list-item{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0;cursor:pointer}
.list-item b{font-weight:600}
.list-item span{font-size:13px;color:var(--muted);text-align:right}

/* detail */
.video{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;margin:12px 0;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.notes{white-space:normal}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .k{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent-text);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent-text)}
.chart .goal{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4}
.chart text{fill:var(--muted);font-size:11px}
.chart .gl{fill:var(--warn)}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hist li:first-child{border-top:0}
.hist b{display:inline-block;min-width:64px}

/* goals */
.status{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.st-on,.st-done{color:var(--good)}
.st-behind,.st-missed{color:var(--bad)}
.st-early{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:10px 0 6px}
.bar > i{display:block;height:100%;background:var(--accent-text);border-radius:99px}
.goal-line{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}

/* volume */
.vol{display:grid;grid-template-columns:92px 1fr 44px;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.vol .track{position:relative;height:12px;background:var(--surface2);border-radius:99px}
.vol .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent-text);border-radius:99px}
.vol .avg{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.55}
.vol .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.legend{font-size:12px;color:var(--muted);margin-top:8px}

/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;
  border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet .close{position:absolute;right:12px;top:12px}
.field{display:block;margin:12px 0;font-size:14px;color:var(--muted);border:0;padding:0}
.field > input,.field > select,.field > textarea{margin-top:4px;color:var(--text)}
.field legend{padding:0;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.chip span{display:inline-block;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font-size:14px;cursor:pointer}
.chip input:checked + span{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.chip input:focus-visible + span{outline:2px solid var(--accent-text)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:12px;color:var(--muted);cursor:pointer}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent-text);font-weight:600}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header class="top"><h1 id="title">Log</h1></header>
<main id="view"></main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="log"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Log</button>
  <button data-tab="exercises"><svg viewBox="0 0 24 24"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>Exercises</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Progress</button>
  <button data-tab="data"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>Data</button>
</nav>

<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ============ Constants & storage ============ */
const KEY = 'liftlog.v1';
const MUSCLES = ['Chest','Back','Shoulders','Biceps','Triceps','Forearms','Quads','Hamstrings','Glutes','Calves','Core'];
const SEED = [
  ['Bench Press','Chest',['Triceps','Shoulders']],
  ['Incline Dumbbell Press','Chest',['Shoulders','Triceps']],
  ['Overhead Press','Shoulders',['Triceps']],
  ['Lateral Raise','Shoulders',[]],
  ['Pull-up','Back',['Biceps']],
  ['Lat Pulldown','Back',['Biceps']],
  ['Barbell Row','Back',['Biceps','Forearms']],
  ['Deadlift','Back',['Hamstrings','Glutes','Forearms']],
  ['Squat','Quads',['Glutes','Core']],
  ['Leg Press','Quads',['Glutes']],
  ['Romanian Deadlift','Hamstrings',['Glutes','Back']],
  ['Hip Thrust','Glutes',['Hamstrings']],
  ['Bicep Curl','Biceps',['Forearms']],
  ['Triceps Pushdown','Triceps',[]],
  ['Calf Raise','Calves',[]],
  ['Hanging Leg Raise','Core',[]],
];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function freshDb(){
  return {
    version: 1,
    exercises: SEED.map(([name, primary, secondary]) => ({id: uid(), name, primary, secondary, video: '', notes: ''})),
    workouts: [],
    goals: [],
    meta: {}
  };
}
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.exercises) && Array.isArray(d.workouts)) { d.goals ||= []; d.meta ||= {}; return d; }
  } catch (e) {}
  return freshDb();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('Could not save — storage is full or blocked'); }
  if (!db.meta.persistAsked && navigator.storage && navigator.storage.persist) {
    db.meta.persistAsked = true;
    navigator.storage.persist().catch(() => {});
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
  }
}

let db = load();
const state = {tab: 'log', date: '', exId: null, q: ''};

/* ============ Helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
function iso(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayISO(){ return iso(new Date()); }
function toDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function dnum(s){ const [y,m,d] = s.split('-').map(Number); return Date.UTC(y, m-1, d) / 864e5; }
function addDays(s, n){ const d = toDate(s); d.setDate(d.getDate() + n); return iso(d); }
function weekStart(s){ const d = toDate(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); }
function fmtDate(s, opts){ return toDate(s).toLocaleDateString(undefined, opts || {day:'numeric', month:'short'}); }

const e1rm = (w, r) => (!w || !r) ? 0 : (r === 1 ? w : w * (1 + r / 30));   // Epley
const r1 = n => Math.round(n * 10) / 10;
const fmtKg = n => String(Math.round(n * 100) / 100);
const fmtSet = s => s.w > 0 ? `${fmtKg(s.w)} kg × ${s.r}` : `BW × ${s.r}`;
const signed = n => (n >= 0 ? '+' : '−') + r1(Math.abs(n));

function exById(id){ return db.exercises.find(e => e.id === id); }
function sortedWorkouts(){ return [...db.workouts].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); }
function workoutFor(date, create){
  let w = db.workouts.find(w => w.date === date);
  if (!w && create) { w = {id: uid(), date, entries: []}; db.workouts.push(w); }
  return w;
}
function pruneWorkouts(){ db.workouts = db.workouts.filter(w => w.entries.length); }

/* history: [{date, sets}] oldest first */
function history(exId){
  const out = [];
  for (const w of sortedWorkouts())
    for (const en of w.entries)
      if (en.exId === exId && en.sets.length) out.push({date: w.date, sets: en.sets});
  return out;
}
const isWeighted = h => h.some(x => x.sets.some(s => s.w > 0));
const metric = (s, weighted) => weighted ? e1rm(s.w, s.r) : s.r;
function sessionBest(sets, weighted){
  let set = null, value = -1;
  for (const s of sets){ const v = metric(s, weighted); if (v > value){ value = v; set = s; } }
  return {set, value};
}
function lastBefore(exId, date){
  const h = history(exId).filter(x => x.date < date);
  return h[h.length - 1] || null;
}
/* A PR = a session's best set beating every previous session of that exercise */
function computePRs(){
  const prs = new Set(), events = [];
  for (const ex of db.exercises){
    const h = history(ex.id), weighted = isWeighted(h);
    let best = null;
    for (const sess of h){
      const sb = sessionBest(sess.sets, weighted);
      if (best !== null && sb.value > best + 1e-9){ prs.add(sb.set); events.push({date: sess.date, exId: ex.id, set: sb.set}); }
      if (best === null || sb.value > best) best = sb.value;
    }
  }
  return {prs, events};
}
function linreg(pts){
  const n = pts.length, mx = pts.reduce((a, p) => a + p.x, 0) / n, my = pts.reduce((a, p) => a + p.y, 0) / n;
  let sxy = 0, sxx = 0;
  for (const p of pts){ sxy += (p.x - mx) * (p.y - my); sxx += (p.x - mx) ** 2; }
  const slope = sxx ? sxy / sxx : 0;
  return {slope, intercept: my - slope * mx};
}
function muscleSets(from, to){
  const m = {};
  for (const w of db.workouts){
    if (w.date < from || w.date >= to) continue;
    for (const en of w.entries){
      const ex = exById(en.exId), n = en.sets.length;
      if (!ex || !n) continue;
      m[ex.primary] = (m[ex.primary] || 0) + n;
      for (const s of ex.secondary) m[s] = (m[s] || 0) + n / 2;
    }
  }
  return m;
}
function ytId(url){
  const m = String(url || '').match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
const safeUrl = u => /^https?:\/\//i.test(u) ? u : 'https://' + String(u).replace(/^\/+/, '');

/* ============ Goals ============ */
function goalStatus(g){
  const weighted = g.w > 0, T = weighted ? e1rm(g.w, g.r) : g.r, unit = weighted ? 'kg' : 'reps';
  const today = todayISO(), h = history(g.exId);
  const hit = h.find(x => x.date >= g.created && x.sets.some(s => s.w >= g.w && s.r >= g.r));
  if (hit) return {state: 'done', tag: 'Achieved', label: `Hit on ${fmtDate(hit.date)}`, pct: 1};
  const pts = h.map(x => ({x: dnum(x.date), y: sessionBest(x.sets, weighted).value}));
  const recent = pts.filter(p => p.x >= dnum(today) - 28);
  const current = recent.length ? Math.max(...recent.map(p => p.y)) : (pts.length ? pts[pts.length - 1].y : 0);
  const pct = T ? Math.max(0, Math.min(1, current / T)) : 0;
  const cur = weighted ? `Recent best ≈ ${r1(current)} kg est. 1RM · target ≈ ${r1(T)}` : `Recent best ${current} reps · target ${T}`;
  const daysLeft = dnum(g.by) - dnum(today);
  if (daysLeft < 0) return {state: 'missed', tag: 'Missed', label: 'Deadline passed — set a new date?', pct, cur};
  const win = pts.filter(p => p.x >= dnum(today) - 56);
  if (win.length < 3) return {state: 'early', tag: 'Too early', label: 'Log 3+ sessions to see a trend', pct, cur};
  const {slope, intercept} = linreg(win);
  const proj = intercept + slope * dnum(g.by), perWeek = slope * 7;
  const need = daysLeft > 0 ? (T - current) / (daysLeft / 7) : T - current;
  if (proj >= T) return {state: 'on', tag: 'On pace', label: `Trending ${signed(perWeek)} ${unit}/week`, pct, cur};
  return {state: 'behind', tag: 'Behind', label: `Need ${signed(need)} ${unit}/week · trending ${signed(perWeek)}`, pct, cur};
}
function goalHTML(g, withName){
  const ex = exById(g.exId); if (!ex) return '';
  const st = goalStatus(g);
  const target = g.w > 0 ? `${fmtKg(g.w)} kg × ${g.r}` : `${g.r} reps`;
  return `<div class="goal-line"><div>${withName ? `<b>${esc(ex.name)}</b><br>` : ''}<span>${target}</span> <span class="muted sm">by ${fmtDate(g.by, {day:'numeric', month:'short', year:'numeric'})}</span></div>
    <span class="status st-${st.state}">${st.tag}</span></div>
    <div class="bar"><i style="width:${Math.round(st.pct * 100)}%"></i></div>
    <div class="sm">${esc(st.label)}</div>${st.cur ? `<div class="sm muted">${esc(st.cur)}</div>` : ''}`;
}

/* ============ Views ============ */
function muscleTags(ex){
  return `<span class="tag main">${esc(ex.primary)}</span>` + ex.secondary.map(m => `<span class="tag">${esc(m)}</span>`).join('');
}

function viewLog(){
  const d = state.date, today = todayISO(), w = workoutFor(d), {prs} = computePRs();
  const label = fmtDate(d, {weekday: 'short', day: 'numeric', month: 'short', year: d.slice(0, 4) !== today.slice(0, 4) ? 'numeric' : undefined});
  let h = `<div class="datebar">
      <button class="icon-btn" data-action="day" data-n="-1" aria-label="Previous day">‹</button>
      <label class="datepick"><span>${d === today ? 'Today · ' : ''}${esc(label)}</span><input type="date" value="${d}" data-change="date" aria-label="Pick date"></label>
      <button class="icon-btn" data-action="day" data-n="1" aria-label="Next day">›</button></div>`;
  if (d !== today) h += `<button class="link" data-action="today">Jump to today</button>`;
  if (!w || !w.entries.length) h += `<div class="empty">Nothing logged ${d === today ? 'today' : 'on this day'} yet.</div>`;
  else w.entries.forEach((en, i) => { h += entryCard(en, i, d, prs); });
  h += `<button class="btn primary block" data-action="pick-ex">+ Add exercise</button>`;
  return h;
}
function entryCard(en, i, d, prs){
  const ex = exById(en.exId) || {name: '(deleted)', primary: '—', secondary: []};
  const prev = lastBefore(en.exId, d);
  const last = en.sets[en.sets.length - 1] || (prev && prev.sets[0]) || {w: '', r: ''};
  let h = `<section class="card">
    <div class="row between"><button class="ex-name" data-action="open-ex" data-id="${en.exId}">${esc(ex.name)} ›</button>
    <button class="icon-btn subtle" data-action="del-entry" data-i="${i}" aria-label="Remove exercise">✕</button></div>
    <div class="tags">${muscleTags(ex)}</div>`;
  if (prev) h += `<div class="prev">Last time (${fmtDate(prev.date)}): ${prev.sets.map(fmtSet).join(', ')}</div>`;
  if (en.sets.length) h += `<ol class="sets">${en.sets.map((s, j) => `<li><span class="n">${j + 1}</span><span class="sv">${fmtSet(s)}</span>${prs.has(s) ? '<span class="badge">PR</span>' : ''}<button class="icon-btn subtle sm" data-action="del-set" data-i="${i}" data-j="${j}" aria-label="Delete set">✕</button></li>`).join('')}</ol>`;
  h += `<div class="addset">
      <label><input inputmode="decimal" id="w${i}" value="${esc(last.w)}" placeholder="0" aria-label="Weight in kg" data-enter="${i}"><span>kg</span></label>
      <label><input inputmode="numeric" id="r${i}" value="${esc(last.r)}" placeholder="0" aria-label="Reps" data-enter="${i}"><span>reps</span></label>
      <button class="btn primary" data-action="add-set" data-i="${i}">Add set</button></div></section>`;
  return h;
}

function filterEx(q){
  q = q.trim().toLowerCase();
  const list = [...db.exercises].sort((a, b) => a.name.localeCompare(b.name));
  if (!q) return list;
  return list.filter(e => e.name.toLowerCase().includes(q) || e.primary.toLowerCase().includes(q) || e.secondary.some(m => m.toLowerCase().includes(q)));
}
function exList(q){
  const list = filterEx(q);
  if (!list.length) return `<div class="empty">No exercises match.</div>`;
  const groups = [...MUSCLES, ...new Set(list.map(e => e.primary).filter(m => !MUSCLES.includes(m)))];
  let h = '';
  for (const g of groups){
    const items = list.filter(e => e.primary === g);
    if (!items.length) continue;
    h += `<div class="group-h">${esc(g)}</div>` + items.map(e => {
      const hist = history(e.id), last = hist[hist.length - 1];
      const meta = last ? `${fmtDate(last.date)} · ${fmtSet(sessionBest(last.sets, isWeighted(hist)).set)}` : 'not logged yet';
      return `<button class="list-item" data-action="open-ex" data-id="${e.id}"><b>${esc(e.name)}</b><span>${esc(meta)}</span></button>`;
    }).join('');
  }
  return h;
}
function viewExerciseList(){
  return `<div class="row gap"><input class="search grow" type="search" placeholder="Search exercises or muscles…" value="${esc(state.q)}" data-input="ex-q">
    <button class="btn primary" data-action="new-ex">+ New</button></div><div id="ex-list">${exList(state.q)}</div>`;
}

function lineChart(pts, target, weighted){
  if (pts.length < 2) return `<div class="empty sm">${pts.length ? 'One session so far — the trend line appears after the next one.' : 'No sessions logged yet.'}</div>`;
  const W = 340, H = 170, L = 36, R = 10, T = 12, B = 24;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) === x0 ? x0 + 1 : Math.max(...xs);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (target){ lo = Math.min(lo, target); hi = Math.max(hi, target); }
  const padY = (hi - lo) * 0.12 || Math.max(1, hi * 0.05); lo = Math.max(0, lo - padY); hi += padY;
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R), Y = y => T + (1 - (y - lo) / (hi - lo)) * (H - T - B);
  let s = '';
  for (let k = 0; k < 3; k++){
    const v = lo + (hi - lo) * k / 2, y = Y(v);
    s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${Math.round(v)}</text>`;
  }
  if (target){ const y = Y(target); s += `<line class="goal" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="gl" x="${W - R}" y="${y - 5}" text-anchor="end">goal</text>`; }
  s += `<path class="ln" d="${pts.map((p, k) => (k ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ')}"/>`;
  s += pts.map(p => `<circle class="dot" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3"/>`).join('');
  s += `<text x="${L}" y="${H - 6}">${esc(fmtDate(pts[0].date))}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(fmtDate(pts[pts.length - 1].date))}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${weighted ? 'Estimated 1RM' : 'Best reps'} over time">${s}</svg>`;
}

function viewExercise(id){
  const ex = exById(id);
  if (!ex){ state.exId = null; return viewExerciseList(); }
  const h = history(id), weighted = isWeighted(h);
  const pts = h.map(x => ({x: dnum(x.date), date: x.date, y: sessionBest(x.sets, weighted).value}));
  let best = null; for (const x of h){ const sb = sessionBest(x.sets, weighted); if (!best || sb.value > best.value) best = sb; }
  const goal = db.goals.find(g => g.exId === id);
  const target = goal ? (goal.w > 0 ? e1rm(goal.w, goal.r) : goal.r) : null;
  const yt = ytId(ex.video);
  let out = `<button class="link" data-action="back">‹ All exercises</button>
    <div class="row between gap"><h2>${esc(ex.name)}</h2><button class="btn small" data-action="edit-ex" data-id="${id}">Edit</button></div>
    <div class="tags">${muscleTags(ex)}</div>`;
  if (yt) out += `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${yt}" title="Technique video" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
  else if (ex.video) out += `<a class="btn block" href="${esc(safeUrl(ex.video))}" target="_blank" rel="noopener">Open technique link ↗</a>`;
  else out += `<div class="card sm">No technique video yet. <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name + ' proper form')}" target="_blank" rel="noopener">Find one on YouTube ↗</a> and paste the link via <b>Edit</b>.</div>`;
  if (ex.notes) out += `<div class="card notes"><div class="sm muted">Form notes</div>${esc(ex.notes).replace(/\n/g, '<br>')}</div>`;
  out += `<div class="tiles">
      <div class="tile"><div class="v">${best ? (weighted ? r1(best.value) : best.value) : '—'}</div><div class="k">${weighted ? 'Best est. 1RM (kg)' : 'Best reps'}</div></div>
      <div class="tile"><div class="v">${best ? fmtSet(best.set).replace(' kg', '') : '—'}</div><div class="k">Best set</div></div>
      <div class="tile"><div class="v">${h.length}</div><div class="k">Sessions</div></div></div>`;
  out += `<div class="card"><h3>${weighted || !h.length ? 'Estimated 1RM per session' : 'Best reps per session'}</h3>${lineChart(pts, target, weighted)}</div>`;
  out += `<div class="card"><div class="row between"><h3>Goal</h3>${goal ? `<button class="btn small" data-action="goal" data-id="${id}">Edit</button>` : ''}</div>
    ${goal ? goalHTML(goal) : `<div class="sm muted">e.g. 100 kg × 5 by March. You'll see whether your trend gets you there in time.</div><button class="btn block" data-action="goal" data-id="${id}">Set a goal</button>`}</div>`;
  if (h.length) out += `<div class="card"><h3>History</h3><ul class="hist">${h.slice(-10).reverse().map(x => `<li><b>${fmtDate(x.date)}</b> ${x.sets.map(fmtSet).join(', ')}</li>`).join('')}</ul></div>`;
  return out;
}

function viewProgress(){
  const today = todayISO(), ws = weekStart(today), d30 = addDays(today, -29);
  const days = new Set(db.workouts.filter(w => w.entries.some(e => e.sets.length)).map(w => w.date));
  const thisWeek = [...days].filter(d => d >= ws && d <= today).length;
  const last30 = [...days].filter(d => d >= d30 && d <= today).length;
  const {events} = computePRs();
  const pr30 = events.filter(e => e.date >= d30).sort((a, b) => a.date < b.date ? 1 : -1);
  let h = `<div class="tiles">
      <div class="tile"><div class="v">${thisWeek}</div><div class="k">Workouts this week</div></div>
      <div class="tile"><div class="v">${last30}</div><div class="k">Last 30 days</div></div>
      <div class="tile"><div class="v">${pr30.length}</div><div class="k">PRs, 30 days</div></div></div>`;

  const cur = muscleSets(ws, addDays(ws, 7)), prev = muscleSets(addDays(ws, -28), ws);
  const rows = MUSCLES.map(m => ({m, c: cur[m] || 0, a: (prev[m] || 0) / 4})).filter(r => r.c || r.a);
  const max = Math.max(1, ...rows.map(r => Math.max(r.c, r.a)));
  h += `<div class="card"><h3>Sets per muscle · this week</h3>`;
  h += rows.length ? rows.map(r => `<div class="vol"><span>${r.m}</span><div class="track"><div class="fill" style="width:${r.c / max * 100}%"></div>${r.a ? `<div class="avg" style="left:${r.a / max * 100}%"></div>` : ''}</div><span class="num">${r1(r.c)}</span></div>`).join('')
      + `<div class="legend">Bar = this week (since ${fmtDate(ws, {weekday: 'short', day: 'numeric', month: 'short'})}). Tick = your average over the previous 4 weeks. Main muscle counts 1 set, secondary muscles ½.</div>`
      : `<div class="empty sm">Log a workout to see where your volume goes.</div>`;
  h += `</div>`;

  h += `<div class="card"><h3>Goals</h3>`;
  const goals = db.goals.filter(g => exById(g.exId));
  h += goals.length ? goals.map(g => `<div style="margin:6px 0 16px;cursor:pointer" data-action="open-ex" data-id="${g.exId}">${goalHTML(g, true)}</div>`).join('')
      : `<div class="sm muted">No goals yet. Open an exercise and tap <b>Set a goal</b>.</div>`;
  h += `</div>`;

  h += `<div class="card"><h3>Recent PRs</h3>`;
  h += pr30.length ? `<ul class="hist">${pr30.slice(0, 12).map(e => `<li><b>${fmtDate(e.date)}</b> ${esc(exById(e.exId).name)} — ${fmtSet(e.set)}</li>`).join('')}</ul>`
      : `<div class="sm muted">None in the last 30 days. A PR is a session whose best set beats every earlier session of that exercise (by estimated 1RM).</div>`;
  h += `</div>`;
  return h;
}

function viewData(){
  const nSets = db.workouts.reduce((a, w) => a + w.entries.reduce((b, e) => b + e.sets.length, 0), 0);
  const last = db.meta.lastExport;
  const age = last ? dnum(todayISO()) - dnum(last) : null;
  return `<div class="card"><h3>Your data</h3>
      <div class="sm">${db.workouts.length} workouts · ${nSets} sets · ${db.exercises.length} exercises</div>
      <div class="sm muted" style="margin-top:4px">Everything is stored only on this device, inside this app. Last backup: ${last ? `${fmtDate(last)} (${age === 0 ? 'today' : age + ' days ago'})` : '<b>never</b>'}.</div>
      <div class="sm muted" id="persist" style="margin-top:4px"></div>
      <button class="btn primary block" data-action="export-json">Back up (JSON)</button>
      <button class="btn block" data-action="export-csv">Export sets as CSV</button>
      <label class="btn block" style="cursor:pointer">Restore from backup…<input type="file" accept="application/json,.json" data-change="import" hidden></label></div>
    <div class="card"><h3>Install on your phone</h3>
      <div class="sm"><b>iPhone:</b> open this page in Safari → Share → <i>Add to Home Screen</i>.<br>
      <b>Android:</b> open in Chrome → ⋮ menu → <i>Install app</i> (or <i>Add to Home screen</i>).<br>
      <span class="muted">Always open it from the home-screen icon — that copy keeps its own data.</span></div></div>
    <div class="card"><h3>How progress is measured</h3>
      <div class="sm muted">Estimated 1RM uses the Epley formula, weight × (1 + reps/30), so 80 × 8 and 90 × 4 can be compared. It's less reliable above ~12 reps. Goal pace is a straight-line trend through your last 8 weeks of sessions.</div></div>
    <button class="btn block danger" data-action="reset">Erase all data</button>`;
}

/* ============ Render ============ */
const TITLES = {log: 'Log', exercises: 'Exercises', progress: 'Progress', data: 'Data'};
function render(){
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  $('#title').textContent = TITLES[state.tab];
  const v = $('#view');
  if (state.tab === 'log') v.innerHTML = viewLog();
  else if (state.tab === 'exercises') v.innerHTML = state.exId ? viewExercise(state.exId) : viewExerciseList();
  else if (state.tab === 'progress') v.innerHTML = viewProgress();
  else { v.innerHTML = viewData(); checkPersist(); }
}
async function checkPersist(){
  const el = $('#persist'); if (!el || !navigator.storage || !navigator.storage.persisted) return;
  try { el.textContent = (await navigator.storage.persisted()) ? 'Storage is marked persistent ✓' : 'The browser may clear this data if the phone runs low on space — keep backups.'; } catch (e) {}
}

/* ============ Modal & toast ============ */
function showModal(html){
  const m = $('#modal');
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><button class="icon-btn close" data-action="close" aria-label="Close">✕</button>${html}</div>`;
  m.hidden = false; document.body.classList.add('lock');
}
function closeModal(){ const m = $('#modal'); m.hidden = true; m.innerHTML = ''; document.body.classList.remove('lock'); }
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

function pickList(q){
  const list = filterEx(q);
  return list.map(e => `<button class="list-item" data-action="pick" data-id="${e.id}"><b>${esc(e.name)}</b><span>${esc(e.primary)}</span></button>`).join('') || '<div class="empty sm">No match.</div>';
}
function openPicker(){
  showModal(`<h3>Add exercise</h3><input class="search" type="search" placeholder="Search…" data-input="pick-q">
    <div id="pick-list">${pickList('')}</div><button class="btn block" data-action="new-ex" data-from="log">+ Create a new exercise</button>`);
}
function openExForm(id, from){
  const ex = id ? exById(id) : {name: '', primary: 'Chest', secondary: [], video: '', notes: ''};
  showModal(`<h3>${id ? 'Edit' : 'New'} exercise</h3>
    <form data-form="ex" data-id="${id || ''}" data-from="${from || ''}">
      <label class="field">Name<input name="name" required value="${esc(ex.name)}" autocomplete="off"></label>
      <label class="field">Main muscle<select name="primary">${MUSCLES.map(m => `<option ${m === ex.primary ? 'selected' : ''}>${m}</option>`).join('')}</select></label>
      <fieldset class="field"><legend>Also works</legend><div class="chips">${MUSCLES.map(m => `<label class="chip"><input type="checkbox" name="secondary" value="${m}" ${ex.secondary.includes(m) ? 'checked' : ''}><span>${m}</span></label>`).join('')}</div></fieldset>
      <label class="field">Technique video or link<input name="video" inputmode="url" autocomplete="off" placeholder="https://youtube.com/watch?v=…" value="${esc(ex.video)}"></label>
      <label class="field">Form notes<textarea name="notes" rows="3" placeholder="Cues, seat height, grip width…">${esc(ex.notes)}</textarea></label>
      <div class="row gap"><button class="btn primary grow" type="submit">Save</button>${id ? `<button class="btn danger" type="button" data-action="del-ex" data-id="${id}">Delete</button>` : ''}</div>
    </form>`);
}
function openGoalForm(exId){
  const g = db.goals.find(g => g.exId === exId);
  const ex = exById(exId);
  showModal(`<h3>Goal · ${esc(ex.name)}</h3>
    <form data-form="goal" data-ex="${exId}">
      <div class="row gap"><label class="field grow">Weight (kg, 0 = bodyweight)<input name="w" inputmode="decimal" required value="${g ? g.w : ''}"></label>
      <label class="field grow">Reps<input name="r" inputmode="numeric" required value="${g ? g.r : 5}"></label></div>
      <label class="field">Achieve by<input name="by" type="date" required value="${g ? g.by : addDays(todayISO(), 84)}"></label>
      <div class="row gap"><button class="btn primary grow" type="submit">Save goal</button>${g ? `<button class="btn danger" type="button" data-action="del-goal" data-id="${exId}">Remove</button>` : ''}</div>
    </form>`);
}

/* ============ Import / export ============ */
async function deliver(name, text, type){
  const file = new File([text], name, {type});
  if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({files: [file]})){
    try { await navigator.share({files: [file], title: name}); return true; }
    catch (e) { if (e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return true;
}
function toCSV(){
  const q = v => /[",\n]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v;
  const lines = ['date,exercise,main_muscle,set,kg,reps,est_1rm'];
  for (const w of sortedWorkouts()) for (const en of w.entries){
    const ex = exById(en.exId) || {name: '(deleted)', primary: ''};
    en.sets.forEach((s, j) => lines.push([w.date, q(ex.name), ex.primary, j + 1, s.w, s.r, r1(e1rm(s.w, s.r))].join(',')));
  }
  return lines.join('\n');
}

/* ============ Actions ============ */
const actions = {
  day: d => { state.date = addDays(state.date, +d.n); render(); },
  today: () => { state.date = todayISO(); render(); },
  'pick-ex': () => openPicker(),
  pick: d => {
    const w = workoutFor(state.date, true);
    w.entries.push({exId: d.id, sets: []}); save(); closeModal(); render();
    const inp = $('#w' + (w.entries.length - 1)); if (inp) { inp.scrollIntoView({block: 'center'}); inp.focus(); }
  },
  'add-set': d => {
    const i = +d.i, w = workoutFor(state.date);
    const kg = parseFloat(($('#w' + i).value || '0').replace(',', '.'));
    const reps = parseInt($('#r' + i).value, 10);
    if (!(reps > 0)) { toast('Enter the number of reps'); $('#r' + i).focus(); return; }
    if (!(kg >= 0)) { toast('Enter a weight (0 for bodyweight)'); return; }
    w.entries[i].sets.push({w: kg, r: reps}); save(); render();
    if (computePRs().prs.has(w.entries[i].sets[w.entries[i].sets.length - 1])) toast('New PR 🎉');
  },
  'del-set': d => { const w = workoutFor(state.date); w.entries[+d.i].sets.splice(+d.j, 1); save(); render(); },
  'del-entry': d => {
    const w = workoutFor(state.date), en = w.entries[+d.i];
    if (en.sets.length && !confirm('Remove this exercise and its sets from this day?')) return;
    w.entries.splice(+d.i, 1); pruneWorkouts(); save(); render();
  },
  'open-ex': d => { closeModal(); state.tab = 'exercises'; state.exId = d.id; render(); scrollTo(0, 0); },
  back: () => { state.exId = null; render(); },
  'new-ex': d => openExForm(null, d.from),
  'edit-ex': d => openExForm(d.id),
  'del-ex': d => {
    const ex = exById(d.id);
    if (!confirm(`Delete "${ex.name}"? All sets logged for it will be removed too.`)) return;
    db.exercises = db.exercises.filter(e => e.id !== d.id);
    db.workouts.forEach(w => { w.entries = w.entries.filter(e => e.exId !== d.id); });
    db.goals = db.goals.filter(g => g.exId !== d.id);
    pruneWorkouts(); save(); closeModal(); state.exId = null; render();
  },
  goal: d => openGoalForm(d.id),
  'del-goal': d => { db.goals = db.goals.filter(g => g.exId !== d.id); save(); closeModal(); render(); },
  close: () => closeModal(),
  'export-json': async () => {
    db.meta.lastExport = todayISO();
    if (await deliver(`liftlog-backup-${todayISO()}.json`, JSON.stringify(db, null, 2), 'application/json')) { save(); render(); }
  },
  'export-csv': () => deliver(`liftlog-sets-${todayISO()}.csv`, toCSV(), 'text/csv'),
  reset: () => {
    if (!confirm('Erase ALL workouts, exercises and goals on this device?')) return;
    if (!confirm('Really? This cannot be undone unless you have a backup.')) return;
    db = freshDb(); save(); state.exId = null; render(); toast('Erased');
  },
};

document.addEventListener('click', e => {
  if (e.target.id === 'modal') return closeModal();
  const tab = e.target.closest('[data-tab]');
  if (tab){
    if (state.tab === tab.dataset.tab && tab.dataset.tab === 'exercises') state.exId = null;
    state.tab = tab.dataset.tab; render(); scrollTo(0, 0); return;
  }
  const t = e.target.closest('[data-action]');
  if (t && actions[t.dataset.action]){ e.preventDefault(); actions[t.dataset.action](t.dataset, t); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.input;
  if (k === 'pick-q') $('#pick-list').innerHTML = pickList(e.target.value);
  if (k === 'ex-q'){ state.q = e.target.value; $('#ex-list').innerHTML = exList(state.q); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset.enter !== undefined){ e.preventDefault(); actions['add-set']({i: e.target.dataset.enter}); }
});
document.addEventListener('change', e => {
  const k = e.target.dataset.change;
  if (k === 'date'){ state.date = e.target.value || todayISO(); render(); }
  if (k === 'import'){
    const f = e.target.files[0]; if (!f) return;
    f.text().then(txt => {
      const d = JSON.parse(txt);
      if (!d || !Array.isArray(d.exercises) || !Array.isArray(d.workouts)) throw new Error('bad');
      if (!confirm(`Replace the data on this device with this backup (${d.workouts.length} workouts)?`)) return;
      d.goals ||= []; d.meta ||= {}; db = d; save(); state.exId = null; render(); toast('Backup restored');
    }).catch(() => toast('That file is not a Lift Log backup'));
    e.target.value = '';
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, fd = new FormData(f);
  if (f.dataset.form === 'ex'){
    const name = String(fd.get('name')).trim(); if (!name) return;
    const primary = fd.get('primary');
    const data = {name, primary, secondary: fd.getAll('secondary').filter(m => m !== primary),
                  video: String(fd.get('video')).trim(), notes: String(fd.get('notes')).trim()};
    let id = f.dataset.id;
    if (id) Object.assign(exById(id), data);
    else { id = uid(); db.exercises.push({id, ...data}); }
    save(); closeModal();
    if (f.dataset.from === 'log'){ workoutFor(state.date, true).entries.push({exId: id, sets: []}); save(); state.tab = 'log'; }
    else { state.tab = 'exercises'; state.exId = id; }
    render();
  }
  if (f.dataset.form === 'goal'){
    const exId = f.dataset.ex, old = db.goals.find(g => g.exId === exId);
    const w = parseFloat(String(fd.get('w')).replace(',', '.')), r = parseInt(fd.get('r'), 10), by = fd.get('by');
    if (!(w >= 0) || !(r > 0) || !by){ toast('Check the goal values'); return; }
    db.goals = db.goals.filter(g => g.exId !== exId);
    db.goals.push({id: old ? old.id : uid(), exId, w, r, by, created: old ? old.created : todayISO()});
    save(); closeModal(); render();
  }
});

/* Refresh "today" when the app comes back to the foreground on a new day */
let lastDay;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && todayISO() !== lastDay){
    if (state.date === lastDay) state.date = todayISO();
    lastDay = todayISO(); render();
  }
});

state.date = lastDay = todayISO();
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
